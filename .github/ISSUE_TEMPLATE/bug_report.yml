name: 🐛 Bug Report
description: Create a report to help us solve a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Before reporting, please make sure you are using the latest version of **Create Shared** and **Create**.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight Checklist
      description: Please verify each item before proceeding.
      options:
        - label: I am using the latest available release of Create Shared.
          required: true
        - label: I have verified that this issue is not already reported in existing issues.
          required: true
        - label: I have tested with minimal mods to confirm the issue is caused by Create Shared.
          required: false

  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      placeholder: "e.g. 1.21.1"
      value: "1.21.1"
    validations:
      required: true

  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge Version
      placeholder: "e.g. 21.1.262"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Create Shared Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: create-version
    attributes:
      label: Create Mod Version
      placeholder: "e.g. 6.0.10"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "Explain what happened..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Place down '...'
        2. Connect with shaft/gearbox
        3. Observe unexpected behavior...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
      placeholder: "What should have happened..."
    validations:
      required: true

  - type: input
    id: logs
    attributes:
      label: Log / Crash Report Link
      description: Please upload your `latest.log` or crash report to [mclo.gs](https://mclo.gs/) or [pastebin](https://pastebin.com/) and paste the link here.
      placeholder: "https://mclo.gs/..."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context & Screenshots
      description: Add any other context, relevant other mods, or paste screenshots here.
